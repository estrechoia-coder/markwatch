# Render Blueprint — MarkWatch fake-door (free plan only, EUR 0)
# Render allows ONE free database per account (edgarfeed-db already uses it),
# so NO database is declared here. Durable measurement uses a free EXTERNAL
# store set via the Render dashboard env (owner paste, one time):
#   - option A (recommended): UPSTASH_REST_URL + UPSTASH_REST_TOKEN (Upstash Redis free)
#   - option B: DATABASE_URL (Neon Postgres free) — server already supports it
# Without env vars the server still runs on jsonl (ephemeral, dev-only).
services:
  - type: web
    name: markwatch
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
